{% extends "base.html" %}
{% block title %}Admin Login{% endblock %}

{% block content %}
  <h2>Admin Login</h2>
  {% if form.errors %}
    <p class="error">Please enter the correct username and password.</p>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Login</button>
    <input type="hidden" name="next" value="{{ next }}">
  </form>
{% endblock %}
