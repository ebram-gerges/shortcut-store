{% load static %}
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <button class="btn btn-outline-light me-3" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasFilters" aria-controls="offcanvasFilters">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="mx-auto navbar-title text-center">Shortcut Store</div>
        <div class="d-flex align-items-center gap-3">
            <!-- Dark Mode Toggle -->
            <button class="theme-toggle me-2" id="themeToggle" aria-label="Toggle dark mode" style="background: none; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; width: 40px; height: 40px; color: white;">
                <i class="fas fa-moon" id="themeIcon"></i>
            </button>

            <!-- Wishlist Icon -->
            <a href="#" class="text-light position-relative" title="Wishlist" data-bs-toggle="offcanvas" data-bs-target="#offcanvasWishlist" aria-controls="offcanvasWishlist">
                <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" fill="none" viewBox="0 0 24 24"><path fill="currentColor" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41 0.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            </a>
            <!-- Cart Icon with Counter -->
            <a href="#" class="text-light position-relative" title="Cart" data-bs-toggle="offcanvas" data-bs-target="#offcanvasCart" aria-controls="offcanvasCart">
                <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" fill="none" viewBox="0 0 24 24"><path fill="currentColor" d="M7 18c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm10 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zM7.16 14.26l.03.01c.13.05.27.08.41.08h8.17c.38 0 .72-.21.88-.55l3.24-6.49A1 1 0 0 0 19 5H6.21l-.94-2H1v2h2l3.6 7.59-1.35 2.44C4.52 16.37 5.48 18 7 18h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.09.76-1.4h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49a1 1 0 0 0-.88-1.48H5.21l-.94-2H1v2h2l3.6 7.59-1.35 2.44C4.52 16.37 5.48 18 7 18h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.09.76-1.4z"/></svg>
                <span class="cart-counter badge rounded-pill bg-danger position-absolute top-0 start-100 translate-middle" style="font-size:0.8rem;">{{ cart_count|default:0 }}</span>
            </a>
            {% if user.profile_pic %}
                <img src="{{ user.profile_pic.url }}" alt="Profile" class="profile-pic rounded-circle border border-2 border-light" style="width:44px;height:44px;object-fit:cover;">
            {% else %}
                <img src="https://ui-avatars.com/api/?name={{ user.username }}" alt="Profile" class="profile-pic rounded-circle border border-2 border-light" style="width:44px;height:44px;object-fit:cover;">
            {% endif %}
        </div>
    </div>
</nav>
