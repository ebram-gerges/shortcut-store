# Advanced Production Nginx Configuration for shortcut-eg.store
# Optimized for 8GB RAM server with enterprise-level security

# Rate limiting zones - Cybersecurity focused
limit_req_zone $binary_remote_addr zone=api:10m rate=100r/h;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=admin:10m rate=10r/h;
limit_req_zone $binary_remote_addr zone=register:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=cart:10m rate=60r/h;
limit_req_zone $binary_remote_addr zone=wishlist:10m rate=30r/h;
limit_req_zone $binary_remote_addr zone=general:10m rate=200r/h;

# Connection limiting
limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;
limit_conn_zone $server_name zone=conn_limit_per_server:10m;

# Geo-blocking (optional - for Egypt focus)
geo $blocked_country {
    default 0;
    # Add specific country blocks if needed
    # ~^CN 1; # Block China
    # ~^RU 1; # Block Russia
}

# Bot detection
map $http_user_agent $bot_detection {
    default 0;
    ~*bot 1;
    ~*crawl 1;
    ~*spider 1;
    ~*scan 1;
    ~*hack 1;
    ~*attack 1;
}

# Upstream Django application - Optimized for 8GB RAM
upstream django {
    server 127.0.0.1:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name shortcut-eg.store www.shortcut-eg.store 147.93.127.239;
    
    # Security headers even for HTTP
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }
    
    # Block all other HTTP traffic
    location / {
        return 301 https://shortcut-eg.store$request_uri;
    }
}

# Main HTTPS Server Configuration
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shortcut-eg.store www.shortcut-eg.store;
    
    # SSL Configuration - A+ Security Rating
    ssl_certificate /etc/letsencrypt/live/shortcut-eg.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shortcut-eg.store/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/shortcut-eg.store/chain.pem;
    
    # Modern SSL Configuration
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    
    # Advanced Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' https: data:; connect-src 'self' https:; media-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self';" always;
    
    # Server signature hiding
    server_tokens off;
    
    # Connection limits
    limit_conn conn_limit_per_ip 10;
    limit_conn conn_limit_per_server 1000;
    
    # Basic Settings - Optimized for 8GB RAM
    client_max_body_size 10M;
    client_body_timeout 60s;
    client_header_timeout 60s;
    keepalive_timeout 65s;
    send_timeout 60s;
    client_body_buffer_size 16k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;
    
    # Block malicious requests
    if ($blocked_country) {
        return 444;
    }
    
    if ($bot_detection) {
        return 429;
    }
    
    # Block common attack patterns
    location ~* \.(php|asp|aspx|jsp|cgi)$ {
        return 444;
    }
    
    location ~* /(wp-admin|phpmyadmin|admin|xmlrpc\.php|wp-login\.php) {
        return 444;
    }
    
    # Gzip Compression - Optimized for performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml
        font/woff
        font/woff2;
    
    # Static Files - Aggressive caching
    location /static/ {
        alias /var/www/shortcut-store/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary Accept-Encoding;
        
        # Security for static files
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            # Prevent hotlinking
            valid_referers none blocked shortcut-eg.store www.shortcut-eg.store;
            if ($invalid_referer) {
                return 403;
            }
        }
        
        # Block access to sensitive static files
        location ~* \.(env|log|conf|ini)$ {
            deny all;
        }
    }
    
    # Media Files - Moderate caching with security
    location /media/ {
        alias /var/www/shortcut-store/media/;
        expires 30d;
        add_header Cache-Control "public";
        add_header Vary Accept-Encoding;
        
        # Prevent execution of uploaded files
        location ~* \.(php|php5|phtml|pl|py|jsp|asp|sh|cgi)$ {
            deny all;
        }
        
        # Security for media files
        location ~* \.(jpg|jpeg|png|gif|webp|svg|pdf|doc|docx)$ {
            expires 30d;
            add_header Cache-Control "public";
            # Prevent hotlinking
            valid_referers none blocked shortcut-eg.store www.shortcut-eg.store;
            if ($invalid_referer) {
                return 403;
            }
        }
    }
    
    # Authentication Endpoints - Heavily rate limited
    location ~ ^/(api/auth/|accounts/) {
        limit_req zone=auth burst=3 nodelay;
        limit_req_status 429;
        
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        
        # Additional security headers for auth
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
    }
    
    # Registration endpoint - Extra protection
    location ~ ^/(api/auth/register|accounts/signup) {
        limit_req zone=register burst=2 nodelay;
        limit_req_status 429;
        
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
    
    # Login endpoint - Strict rate limiting
    location ~ ^/(api/auth/login|accounts/login) {
        limit_req zone=login burst=3 nodelay;
        limit_req_status 429;
        
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
    
    # Admin Interface - Maximum security
    location /secure-admin-panel-2024/ {
        limit_req zone=admin burst=3 nodelay;
        limit_req_status 429;
        
        # Additional IP restrictions (uncomment and customize as needed)
        # allow 147.93.127.239;
        # allow 192.168.0.0/16;
        # deny all;
        
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        
        # Admin-specific timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Block common admin attack patterns
        if ($request_method !~ ^(GET|POST)$) {
            return 405;
        }
    }
    
    # Cart API - Moderate rate limiting
    location /api/cart/ {
        limit_req zone=cart burst=10 nodelay;
        limit_req_status 429;
        
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
    
    # Wishlist API - Moderate rate limiting
    location /api/wishlist/ {
        limit_req zone=wishlist burst=5 nodelay;
        limit_req_status 429;
        
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
    
    # General API Endpoints
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;
        
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        
        # API response caching for GET requests
        location ~* ^/api/(products|categories)/ {
            if ($request_method = GET) {
                add_header Cache-Control "public, max-age=300";
            }
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
    
    # Health Check - No rate limiting
    location /healthz/ {
        proxy_pass http://django;
        access_log off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Frontend Application - General rate limiting
    location / {
        limit_req zone=general burst=50 nodelay;
        limit_req_status 429;
        
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        
        # Connection settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
    
    # Block access to sensitive files and directories
    location ~ /\. {
        deny all;
        return 404;
    }
    
    location ~ ^/(\.env|\.git|requirements\.txt|manage\.py|docker-compose|Dockerfile) {
        deny all;
        return 404;
    }
    
    location ~ ^/(logs|backups|ssl)/ {
        deny all;
        return 404;
    }
    
    # Custom error pages
    error_page 404 /404.html;
    error_page 429 /429.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /50x.html {
        root /var/www/html;
    }
    
    location = /404.html {
        root /var/www/html;
    }
    
    location = /429.html {
        root /var/www/html;
    }
}

# Redirect www to non-www
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.shortcut-eg.store;
    
    ssl_certificate /etc/letsencrypt/live/shortcut-eg.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shortcut-eg.store/privkey.pem;
    
    return 301 https://shortcut-eg.store$request_uri;
}

# Block direct IP access
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name 147.93.127.239 _;
    
    ssl_certificate /etc/letsencrypt/live/shortcut-eg.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shortcut-eg.store/privkey.pem;
    
    return 444;
}