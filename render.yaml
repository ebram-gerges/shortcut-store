services:
  - type: web
    name: shortcut-store-backend
    env: python
    buildCommand: |
      pip install -r requirements.txt
      cd frontend && npm install && npm run build && cd ..
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: gunicorn shortcut.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: shortcut.settings_production
      - key: SECRET_KEY
