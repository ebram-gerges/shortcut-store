# Django application logs
/home/bero/Desktop/shortcut-store/logs/*.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    create 644 www-data www-data
    postrotate
        systemctl reload gunicorn
    endscript
}

# Gunicorn logs
/var/log/gunicorn/*.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    create 644 www-data www-data
    postrotate
        systemctl reload gunicorn
    endscript
}

# Celery logs
/var/log/celery/*.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    create 644 www-data www-data
    postrotate
        systemctl reload celery
        systemctl reload celery-beat
    endscript
}

# PostgreSQL logs
/var/lib/postgresql/*/data/log/*.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    create 640 postgres postgres
    postrotate
        systemctl reload postgresql
    endscript
} 